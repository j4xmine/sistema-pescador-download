name: Publish GuiaBridge 0.5.40 release

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-guiabridge-0540.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TAG: guiabridge-v0.5.40
      INSTALLER: SistemaPescador-GuiaBridge-Atualizacao-0.5.40.exe
      INSTALLER_SHA256: f2dda783d5eaadeda1a4002dd748c7149b4227c8c926895da8585512a2024977
      ARTIFACT_SHA256: b7311d766e0a1f3d5e6ebe141190eccd1fc51a05c5b0b60cf1d7819a2d000d8b
      SOURCE_URL: "https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-90a0-820e-8a4c-eee5cf3d69be/raw?se=2026-09-22T21%3A50%3A48Z&sp=r&sv=2026-02-06&sr=b&scid=832857c0-2273-5a06-bfa6-0b04fc8627c7&skoid=db6dad9e-03ee-465b-aef6-ce0f63a161dc&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-22T21%3A11%3A08Z&ske=2026-09-23T21%3A11%3A08Z&sks=b&skv=2026-02-06&sig=cBkdvGb3WO29CGCAQAxA5Ke72YCE3GV3KV4xSSo0ArI%3D"

    steps:
      - uses: actions/checkout@v4

      - name: Download validated package
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 4 --retry-delay 2 "$SOURCE_URL" -o guia-bridge-0.5.40.zip
          echo "$ARTIFACT_SHA256  guia-bridge-0.5.40.zip" | sha256sum -c -
          mkdir dist
          unzip -q guia-bridge-0.5.40.zip -d dist
          test -f "dist/$INSTALLER"
          echo "$INSTALLER_SHA256  dist/$INSTALLER" | sha256sum -c -
          test -f dist/SHA256SUMS.txt
          test -f dist/guia-bridge-manifest.json
          test -f dist/ATUALIZACAO-GUIABRIDGE.md

      - name: Prepare release notes
        shell: bash
        run: |
          cat > release-notes.md <<'EOF'
          Hotfix complementar do **GuiaBridge 0.5.40** para a Central de GPS do Sistema Pescador.

          Corrige o timeout no login GOV.BR/eSocial em que o Playwright localizava o botão oficial **Entrar**, confirmava que estava visível e habilitado, mas permanecia aguardando estabilidade do clique até expirar.

          ### Correção
          - a senha continua sendo enviada exclusivamente pelo stdin privado;
          - o formulário passa a ser submetido pela tecla **Enter** no próprio campo de senha, conforme indicado pela interface oficial do GOV.BR;
          - permanece um fallback restrito ao botão oficial já localizado e habilitado;
          - CPF e senha não são adicionados a argumentos, logs ou JSON.

          ### Instalação
          1. Feche o Sistema Pescador e qualquer navegador aberto pela automação.
          2. Execute **SistemaPescador-GuiaBridge-Atualizacao-0.5.40.exe**.
          3. Aceite a elevação do Windows.
          4. Reabra o Sistema Pescador e use **Testar login** na Central de GPS.

          O instalador atualiza somente `C:\Sistema Pescador\GuiaBridge`, cria backup em `C:\Sistema Pescador\Backups\GuiaBridge-pre-0.5.40-<data>` e preserva frontend, banco SQLite, documentos, ScannerBridge e perfis do navegador.

          ### Validação
          - build, empacotamento, atualização, reinstalação, isolamento de ambientes, hashes e preservação de arquivos aprovados no GitHub Actions;
          - login real no GOV.BR/eSocial confirmado com sucesso em 22/09/2026 no primeiro computador de produção;
          - segundo computador ainda será atualizado com o mesmo pacote.

          Código principal da correção: `30ec67b41824993edd331894b6a9269fe102214a`.

          Empacotamento validado: `77b88749cd9ffeeece76bacf3c739fba79bfc3b4`.

          SHA-256 do instalador: `f2dda783d5eaadeda1a4002dd748c7149b4227c8c926895da8585512a2024977`.
          EOF

      - name: Publish prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG"               "dist/$INSTALLER"               dist/SHA256SUMS.txt               dist/guia-bridge-manifest.json               dist/ATUALIZACAO-GUIABRIDGE.md               --clobber               --repo "$GITHUB_REPOSITORY"
            gh release edit "$TAG"               --title "GuiaBridge 0.5.40 — hotfix do login GOV.BR"               --notes-file release-notes.md               --prerelease               --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG"               "dist/$INSTALLER"               dist/SHA256SUMS.txt               dist/guia-bridge-manifest.json               dist/ATUALIZACAO-GUIABRIDGE.md               --target main               --title "GuiaBridge 0.5.40 — hotfix do login GOV.BR"               --notes-file release-notes.md               --prerelease               --repo "$GITHUB_REPOSITORY"
          fi
