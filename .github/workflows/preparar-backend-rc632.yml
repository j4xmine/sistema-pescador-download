name: Preparar backend validado RC63.2
on:
  push:
    branches: [main]
    paths: [.github/workflows/preparar-backend-rc632.yml]
permissions:
  contents: write
jobs:
  preparar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Verificar e preservar backend em rascunho
        shell: python
        run: |
          import base64,hashlib,json,os,pathlib,subprocess,urllib.request,shutil
          repo=os.environ['GITHUB_REPOSITORY'];tag='v1.0.0-rc.63-rede.2'
          data=json.loads("{\"jarUrl\":\"https://release-assets.githubusercontent.com/github-production-release-asset/1269516953/2c2dc168-d805-41a5-ac59-52cee3e68fe1?sp=r&sv=2018-11-09&sr=b&spr=https&se=2026-10-08T20%3A35%3A10Z&rscd=attachment%3B+filename%3Dsistema-pescador-backend-rede-corporativa.jar&rsct=application%2Foctet-stream&skoid=96c2d410-5711-43a1-aedd-ab1947aa7ab0&sktid=398a6654-997b-47e9-b12b-9515b896b4de&skt=2026-10-08T19%3A34%3A46Z&ske=2026-10-08T20%3A35%3A10Z&sks=b&skv=2018-11-09&sig=rmWKdGA7d1DkZ5fs6bwl1FDjCEz5fDme%2Bz1%2F6gkIY9g%3D&jwt=eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJpc3MiOiJnaXRodWIuY29tIiwiYXVkIjoicmVsZWFzZS1hc3NldHMuZ2l0aHVidXNlcmNvbnRlbnQuY29tIiwia2V5Ijoia2V5MSIsImV4cCI6MTc5MTQ5MzI1NywibmJmIjoxNzkxNDg5NjU3LCJwYXRoIjoicmVsZWFzZWFzc2V0cHJvZHVjdGlvbi5ibG9iLmNvcmUud2luZG93cy5uZXQifQ.8Ys8bnfJCcEQck-C_CfRtkVyHeeGakQ0tdY2HoFtlaQ&response-content-disposition=attachment%3B%20filename%3Dsistema-pescador-backend-rede-corporativa.jar&response-content-type=application%2Foctet-stream\",\"files\":{\"SHA256SUMS.txt\":\"\",\"backend-manifest.json\":\"\",\"REDE-CORPORATIVA-RC63.md\":\"\",\"instalar-rede-corporativa.sh\":\"\"}}")
          folder=pathlib.Path('backend');folder.mkdir()
          for name,encoded in data['files'].items():
              assert pathlib.PurePosixPath(name).name==name
              (folder/name).write_bytes(base64.b64decode(encoded))
          print('::add-mask::'+data['jarUrl'])
          with urllib.request.urlopen(data['jarUrl'],timeout=120) as r,(folder/'sistema-pescador-backend-rede-corporativa.jar').open('wb') as out: shutil.copyfileobj(r,out)
          def digest(path): return hashlib.sha256(path.read_bytes()).hexdigest()
          for line in (folder/'SHA256SUMS.txt').read_text().splitlines():
              expected,name=line.split(None,1);assert digest(folder/name)==expected,name
          manifest=json.loads((folder/'backend-manifest.json').read_text())
          assert manifest['commit']=='fb943fe2560c70d97fa686a11cb551cf5d86029f'
          (folder/'SHA256SUMS.txt').rename(folder/'SHA256SUMS-backend.txt')
          def gh(*args): return subprocess.check_output(['gh',*args],text=True).strip()
          assert gh('api',f'repos/{repo}/contents/desktop-update.json','--jq','.sha')=='a0688f2359917a91665ee6063b5309f3cc89dc70'
          gh('release','create',tag,'--repo',repo,'--draft','--prerelease','--latest=false','--title','RC63.2 — Foto, @username e conversa flutuante','--notes','Backend validado. Aguardando instalador Windows e verificacao final.')
          gh('release','upload',tag,'--repo',repo,*[str(p) for p in sorted(folder.iterdir())])
          release=json.loads(gh('api',f'repos/{repo}/releases/tags/{tag}'))
          assert release['draft'] and len(release['assets'])==5
          for a in release['assets']: assert a['digest']=='sha256:'+digest(folder/a['name']),a['name']
          print('BACKEND_DRAFT_VERIFIED=True')
          
