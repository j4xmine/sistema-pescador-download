name: Publicar Marlin verificada
on:
  push:
    branches: [release/marlin-1.1.0]
permissions:
  contents: write
concurrency:
  group: publicacao-marlin-1.1.0
  cancel-in-progress: false
jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: v1.1.0
      FRONT_BLOB: 3a63dd0b17db74dbe1ae0a5277e2b421d014ecb7
      FRONT_COMMIT: e6fc06e7ad258380d74cb12ee6339850541ba8f3
      FRONT_MANIFEST_SHA: 67ce78165422a9cb5fc615cd1f90529bd09a73fb057794ba5aa5bc66c5157ddc
      INSTALLER_SHA: 7590628266474a83e2c354194c453d99ba6aa241d245873b923fdfe0feb13eaa
      CATALOG_SHA: ff45261adc64ecf4a386ea8a472e0a5acfeb3e27da7e2a69634ac1939f6f0e34
    steps:
      - name: Recuperar e conferir os mesmos arquivos validados
        run: |
          set -Eeuo pipefail
          gh api "repos/$GH_REPO/git/blobs/$FRONT_BLOB" > transport.json
          python3 - <<'PY'
          import base64,hashlib,json,os,shutil,urllib.request
          from pathlib import Path
          from urllib.parse import urlparse
          root=Path('dist');root.mkdir()
          def sha(p):return hashlib.sha256(p.read_bytes()).hexdigest()
          envelope=json.loads(Path('transport.json').read_text())
          assert envelope['encoding']=='base64'
          data=json.loads(base64.b64decode(envelope['content'],validate=False))
          names={'unified-manifest.json','MARLIN.md','MARLIN-REVISAO.md','desktop-update-marlin.json','SHA256SUMS.txt'}
          assert set(data['files'])==names
          for name in names:
              raw=base64.b64decode(data['files'][name],validate=True)
              assert len(raw)<2*1024*1024
              (root/name).write_bytes(raw)
          url=data['installerUrl'];p=urlparse(url)
          assert p.scheme=='https' and p.hostname=='release-assets.githubusercontent.com'
          print('::add-mask::'+url)
          setup='SistemaPescador-Setup-1.1.0.exe'
          alias='SistemaPescador-Atualizacao-1.1.0.exe'
          with urllib.request.urlopen(url,timeout=90) as src,(root/setup).open('wb') as dest:
              while block:=src.read(1024*1024):
                  dest.write(block);assert dest.tell()<250*1024*1024
          assert sha(root/setup)==os.environ['INSTALLER_SHA']
          shutil.copyfile(root/setup,root/alias)
          assert sha(root/'unified-manifest.json')==os.environ['FRONT_MANIFEST_SHA']
          assert sha(root/'desktop-update-marlin.json')==os.environ['CATALOG_SHA']
          f=json.loads((root/'unified-manifest.json').read_text(encoding='utf-8-sig'))
          assert f['frontendCommit']==os.environ['FRONT_COMMIT'] and f['version']=='1.1.0'
          assert f['updateSequence']==6600 and f['releaseName']=='Marlin'
          assert f['requiredBackendVersion']=='1.1.0-rc.1-advocacia'
          assert f['bridgeVersion']=='0.5.58' and f['scannerVersion']=='2.0.2' and f['databaseSchemaAfter']==12
          assert {a['name'] for a in f['artifacts']}=={setup,alias}
          for a in f['artifacts']:assert a['sha256']==sha(root/a['name'])
          allowed=names-{'SHA256SUMS.txt'}|{setup,alias}
          seen=set()
          for line in (root/'SHA256SUMS.txt').read_text(encoding='utf-8-sig').splitlines():
              digest,name=line.split('  ',1)
              assert name in allowed and name not in seen
              assert sha(root/name)==digest;seen.add(name)
          assert seen==allowed
          c=json.loads((root/'desktop-update-marlin.json').read_text())['release']
          assert c['version']=='1.1.0' and c['sequence']==6600 and c['releaseName']=='Marlin'
          assert c['approved'] is True and c['backendReady'] is True
          assert c['downloadUrl']=='https://github.com/j4xmine/sistema-pescador-download/releases/download/v1.1.0/'+alias
          assert {'1.0.0','1.1.0-rc.1','1.1.0-rc.2'}.issubset(c['acceptedInstalledVersions'])
          expected={p.name:{'digest':'sha256:'+sha(p),'size':p.stat().st_size} for p in root.iterdir()}
          Path('expected.json').write_text(json.dumps(expected))
          print('BINARIOS_IGUAIS_AOS_VALIDADOS=True')
          print('SHA256_INSTALADOR='+sha(root/setup))
          PY
      - name: Publicar e validar todos os arquivos antes de liberar
        run: |
          set -Eeuo pipefail
          if gh release view "$TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            echo 'Versao ja existe; nenhuma substituicao automatica feita.'
            exit 1
          fi
          gh release create "$TAG" --repo "$GH_REPO" --target "$GITHUB_SHA" --draft --title 'v1.1.0 — Marlin' --notes-file dist/MARLIN.md dist/*
          gh api "repos/$GH_REPO/releases/tags/$TAG" > uploaded.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          e=json.loads(Path('expected.json').read_text())
          r=json.loads(Path('uploaded.json').read_text())
          assert r['draft'] is True
          assets={a['name']:a for a in r['assets']}
          assert set(assets)==set(e)
          for name,expected in e.items():
              assert assets[name]['digest']==expected['digest']
              assert assets[name]['size']==expected['size']
          print('ARQUIVOS_PUBLICOS_CONFERIDOS=True')
          PY
          gh release edit "$TAG" --repo "$GH_REPO" --draft=false --prerelease=false --latest
          gh release view "$TAG" --repo "$GH_REPO" --json url,isDraft,isPrerelease
