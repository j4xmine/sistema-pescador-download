name: Publicar Marlin verificada
on:
  push:
    branches: [release/marlin-1.1.0]
permissions:
  contents: write
concurrency:
  group: publicacao-marlin-1.1.0
  cancel-in-progress: false
jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Conferir todos os arquivos do rascunho validado
        run: |
          set -Eeuo pipefail
          gh api "repos/$GH_REPO/releases/408560966" > uploaded.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          expected={"desktop-update-marlin.json":{"digest":"sha256:ff45261adc64ecf4a386ea8a472e0a5acfeb3e27da7e2a69634ac1939f6f0e34","size":2357},"MARLIN-REVISAO.md":{"digest":"sha256:70aa8fe331cc7743fa48d5983c05c9177d1c43ec0cb5ab3f5732f66b74086a05","size":1963},"MARLIN.md":{"digest":"sha256:69f0e11252fc27c0ec1fb64402bb387f308255a6a944730851127dc09479ce8f","size":2880},"SHA256SUMS.txt":{"digest":"sha256:d461bc85623a982a1a756ee333577984c6b0cc0b1c6dc3a8c6e9bea1e2816770","size":549},"SistemaPescador-Atualizacao-1.1.0.exe":{"digest":"sha256:7590628266474a83e2c354194c453d99ba6aa241d245873b923fdfe0feb13eaa","size":106046760},"SistemaPescador-Setup-1.1.0.exe":{"digest":"sha256:7590628266474a83e2c354194c453d99ba6aa241d245873b923fdfe0feb13eaa","size":106046760},"unified-manifest.json":{"digest":"sha256:67ce78165422a9cb5fc615cd1f90529bd09a73fb057794ba5aa5bc66c5157ddc","size":54569}}
          release=json.loads(Path('uploaded.json').read_text())
          assert release['id']==408560966 and release['tag_name']=='v1.1.0'
          assert release['draft'] is True
          assert release['target_commitish']=='af680d40b9c8a82769215314450f1e8fe28b45cf'
          assets={a['name']:a for a in release['assets']}
          assert set(assets)==set(expected)
          for name,checks in expected.items():
              assert assets[name]['state']=='uploaded'
              assert assets[name]['digest']==checks['digest'],name
              assert assets[name]['size']==checks['size'],name
          print('SETE_ARQUIVOS_IGUAIS_AOS_VALIDADOS=True')
          Path('publish.json').write_text(json.dumps({'draft':False,'prerelease':False,'make_latest':'true'}))
          PY
      - name: Liberar a versao estavel Marlin
        run: |
          set -Eeuo pipefail
          gh api "repos/$GH_REPO/releases/408560966" --method PATCH --input publish.json > published.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('published.json').read_text())
          assert r['draft'] is False and r['prerelease'] is False and r['tag_name']=='v1.1.0'
          print('MARLIN_PUBLICADA='+r['html_url'])
          PY
