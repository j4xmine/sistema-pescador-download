name: Publicar RC63.2 validada
on:
  push:
    branches: [main]
    paths: [.github/workflows/publicar-rc632-validado.yml]
permissions:
  contents: write
jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_FRONTEND: ec31a8d4cefe6da8e28aae282a6c4cb88b6809df
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verificar, publicar e testar downloads
        shell: python
        run: |
          import base64, hashlib, json, os, pathlib, shutil, subprocess, urllib.request
          repo = os.environ['GITHUB_REPOSITORY']
          tag = 'v1.0.0-rc.63-rede.2'
          installer = 'SistemaPescador-Setup-1.0.0-rc.63-rede.2.exe'
          def gh(*args):
              return subprocess.check_output(['gh', *args], text=True).strip()
          def digest(p):
              h=hashlib.sha256()
              with open(p,'rb') as f:
                  for b in iter(lambda:f.read(1024*1024),b''): h.update(b)
              return h.hexdigest()
          def verify(folder):
              for line in (folder/'SHA256SUMS.txt').read_text(encoding='utf-8-sig').splitlines():
                  expected,name=line.split(None,1)
                  name=name.lstrip('*')
                  assert pathlib.PurePosixPath(name).name==name, name
                  assert digest(folder/name)==expected, name
          payload=json.loads(pathlib.Path('.github/release-rc632-transfer.json').read_text())
          for side,key,url_key,binary in [('front','front','installerUrl',installer),('back','back','jarUrl','sistema-pescador-backend-rede-corporativa.jar')]:
              folder=pathlib.Path(side); folder.mkdir()
              data=payload[key]
              for name,encoded in data['files'].items():
                  assert pathlib.PurePosixPath(name).name==name
                  (folder/name).write_bytes(base64.b64decode(encoded))
              if side=='back':
                  gh('release','download',tag,'--repo',repo,'--pattern',binary,'--dir',str(folder))
              else:
                  print('::add-mask::'+data[url_key])
                  with urllib.request.urlopen(data[url_key],timeout=120) as response, (folder/binary).open('wb') as out:
                      shutil.copyfileobj(response,out)
              verify(folder)
          front=json.loads(pathlib.Path('front/unified-manifest.json').read_text(encoding='utf-8-sig'))
          back=json.loads(pathlib.Path('back/backend-manifest.json').read_text())
          assert front['frontendCommit']==os.environ['EXPECTED_FRONTEND'] and front['version']==tag[1:]
          assert front['freshInstallSupported'] and front['backendUpdateRequired'] and front['updateSequence']==6302
          assert back['commit']=='fb943fe2560c70d97fa686a11cb551cf5d86029f'
          assert back['sha256']==digest('back/sistema-pescador-backend-rede-corporativa.jar')
          stable='a0688f2359917a91665ee6063b5309f3cc89dc70'
          assert gh('api',f'repos/{repo}/contents/desktop-update.json','--jq','.sha')==stable
          out=pathlib.Path('dist');out.mkdir()
          for path in pathlib.Path('back').iterdir():
              shutil.copyfile(path,out/('SHA256SUMS-backend.txt' if path.name=='SHA256SUMS.txt' else path.name))
          for name in [installer,'unified-manifest.json','REDE-CORPORATIVA-RC63.md']:
              shutil.copyfile(pathlib.Path('front')/name,out/('REDE-CORPORATIVA-DESKTOP-RC63.md' if name.endswith('.md') else name))
          (out/'SHA256SUMS.txt').write_text(''.join(f'{digest(p)}  {p.name}\n' for p in sorted(out.iterdir())))
          verify(out)
          notes='RC63.2 candidata: foto do perfil nas conexões aceitas e no chat; conversa flutuante com minimizar, expandir e preservar rascunhos; @username opcional e único, com busca exata e confirmação de nome e entidade antes do convite.\n\n## 1. Atualizar o servidor\n\nExecute no mesmo terminal do servidor em que a RC63.1 foi instalada. O script faz backup e restaura a versão anterior se a inicialização falhar.\n\n```bash\nbash <<\'RC632\'\nset -euo pipefail\npasta_rc632=$(mktemp -d "$HOME/pescador-rc632-XXXXXXXX")\ncd "$pasta_rc632"\nbase_rc632="https://github.com/j4xmine/sistema-pescador-download/releases/download/v1.0.0-rc.63-rede.2"\nfor arquivo in SHA256SUMS-backend.txt REDE-CORPORATIVA-RC63.md backend-manifest.json instalar-rede-corporativa.sh sistema-pescador-backend-rede-corporativa.jar; do\n  curl --fail --location --retry 3 "$base_rc632/$arquivo" --output "$arquivo"\ndone\necho \'79ab17a198d7cc8f634df83f853b0f2de713ea386554d0d94b8965d21002b0b5  SHA256SUMS-backend.txt\' | sha256sum --check -\nsha256sum --check SHA256SUMS-backend.txt\nsudo bash ./instalar-rede-corporativa.sh "$PWD/sistema-pescador-backend-rede-corporativa.jar"\nRC632\n```\n\n## 2. Atualizar duas máquinas de teste\n\nApós o servidor confirmar `REDE_CORPORATIVA_BACKEND_INSTALADO=True`, salve o trabalho, feche o sistema e instale `SistemaPescador-Setup-1.0.0-rc.63-rede.2.exe` nas duas máquinas. O instalador é completo e aceita instalação em computador novo.\n\n## 3. Conferir com duas contas\n\n- Em Rede corporativa, use **Definir meu @username**. Exemplo: `ana.souza`.\n- Use **Adicionar conexão**, pesquise o @username exato e confira nome e entidade antes do convite. Conexões existentes continuam válidas.\n- Confira as fotos de perfil nas conexões aceitas e na conversa.\n- Clique em **Conversar**, minimize, restaure, expanda e alterne abas. Confira o rascunho e envie mensagens nos dois sentidos.\n- Confira que mensagens recebidas com a conversa minimizada permanecem não lidas até abrir a conversa.\n\nO canal estável permanece na RC62.2. Esta é uma candidata; a validação integrada com duas contas no seu ambiente ainda é necessária. O teste automatizado passou em 310 testes do backend, 25 específicos da rede e 681 da suíte completa do desktop. Os avisos do Windows dependem do aplicativo aberto.\n'
          pathlib.Path('notes.md').write_text(notes)
          draft=json.loads(gh('api',f'repos/{repo}/releases/407229149'))
          assert draft['draft'] and draft['prerelease']
          existing={a['name']:a for a in draft['assets']}
          for name,a in existing.items(): assert a['digest']=='sha256:'+digest(out/name),name
          gh('release','upload',tag,'--repo',repo,*[str(p) for p in sorted(out.iterdir()) if p.name not in existing])
          release=json.loads(gh('api',f'repos/{repo}/releases/407229149'))
          for a in release['assets']:
              assert a['digest']=='sha256:'+digest(out/a['name']), a['name']
          assert len(release['assets'])==len(list(out.iterdir()))
          gh('release','edit',tag,'--repo',repo,'--draft=false','--prerelease=true','--latest=false','--notes-file','notes.md')
          assert gh('api',f'repos/{repo}/contents/desktop-update.json','--jq','.sha')==stable
          public=pathlib.Path('public-check'); public.mkdir()
          for name in [installer,'sistema-pescador-backend-rede-corporativa.jar']:
              with urllib.request.urlopen(f'https://github.com/{repo}/releases/download/{tag}/{name}',timeout=180) as response, (public/name).open('wb') as downloaded:
                  shutil.copyfileobj(response,downloaded)
              assert digest(public/name)==digest(out/name),name
          print('REDE_PUBLICADA_VERIFICADA=True')
          print('BACKEND_SUMS_SHA256='+digest(out/'SHA256SUMS-backend.txt'))
          print('INSTALLER_SHA256='+digest(out/installer))
          
