name: Publicar RC63.4 validada
on:
  push:
    branches: [release/rc63-rede-4]
permissions:
  contents: read
concurrency:
  group: publicacao-rc63-rede-4
  cancel-in-progress: false
jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: v1.0.0-rc.63-rede.4
      TRANSFER_BLOB: ce4fd6ea2e0ae945b9d490d96454879811624a19
      EXPECTED_FRONTEND: 0dae2edd4477a4263972da097722043949654792
      EXPECTED_INSTALLER: f5bd43dd19d68df08bc3bafac96bc8af6d0437cd0e423cbd2328ca9f99983f4b
      EXPECTED_MANIFEST: 916d6e9af2b88988240dba2264fcfa85e94b070e55047f785fc005331583cc66
    steps:
      - name: Recuperar e conferir o mesmo pacote aprovado no Windows
        shell: bash
        run: |
          set -Eeuo pipefail
          gh api "repos/$GH_REPO/git/blobs/$TRANSFER_BLOB" > transport.json
          python3 - <<'PY'
          import base64, hashlib, json, os, urllib.request
          from pathlib import Path
          from urllib.parse import urlparse
          transport = json.loads(Path('transport.json').read_text())
          assert transport['encoding'] == 'base64'
          data = json.loads(base64.b64decode(transport['content']))
          url = data['installerUrl']
          parsed = urlparse(url)
          assert parsed.scheme == 'https' and parsed.hostname == 'release-assets.githubusercontent.com'
          print('::add-mask::' + url)
          names = {'unified-manifest.json', 'REDE-CORPORATIVA-RC63.md', 'SHA256SUMS.txt'}
          assert set(data['files']) == names
          for name in names:
              Path(name).write_bytes(base64.b64decode(data['files'][name], validate=True))
          manifest_bytes = Path('unified-manifest.json').read_bytes()
          assert hashlib.sha256(manifest_bytes).hexdigest() == os.environ['EXPECTED_MANIFEST']
          manifest = json.loads(manifest_bytes.decode('utf-8-sig'))
          assert manifest['version'] == '1.0.0-rc.63-rede.4'
          assert manifest['updateSequence'] == 6304
          assert manifest['frontendCommit'] == os.environ['EXPECTED_FRONTEND']
          assert manifest['backendUpdateRequired'] is False
          assert manifest['requiredBackendVersion'] == '1.0.0-rc.63-rede.2'
          installer = 'SistemaPescador-Setup-1.0.0-rc.63-rede.4.exe'
          expected = os.environ['EXPECTED_INSTALLER']
          assert manifest['artifacts'] == [{'name': installer, 'sha256': expected}]
          # O endereço temporário autoriza somente o download deste instalador.
          with urllib.request.urlopen(url, timeout=90) as source, Path(installer).open('wb') as dest:
              while block := source.read(1024 * 1024):
                  dest.write(block)
                  assert dest.tell() <= 200 * 1024 * 1024
          assert hashlib.sha256(Path(installer).read_bytes()).hexdigest() == expected
          allowed = names - {'SHA256SUMS.txt'} | {installer}
          seen = set()
          for line in Path('SHA256SUMS.txt').read_text(encoding='utf-8-sig').splitlines():
              digest, name = line.split('  ', 1)
              assert name in allowed and name not in seen
              assert hashlib.sha256(Path(name).read_bytes()).hexdigest() == digest
              seen.add(name)
          assert seen == allowed
          print('PUBLIC_INSTALLER_MATCHES_VALIDATED_BUILD=True')
          Path('transport.json').unlink()
          PY
      - name: Publicar candidata sem alterar canal estavel
        shell: bash
        run: |
          set -Eeuo pipefail
          if gh release view "$TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            echo 'A versao ja existe; nenhuma substituicao automatica foi feita.'
            exit 1
          fi
          gh release create "$TAG" --repo "$GH_REPO" --target "$GITHUB_SHA" --draft --prerelease --latest=false --title "RC63.4 — Chat renovado e agenda organizada" --notes-file REDE-CORPORATIVA-RC63.md SistemaPescador-Setup-1.0.0-rc.63-rede.4.exe unified-manifest.json SHA256SUMS.txt REDE-CORPORATIVA-RC63.md
          gh release edit "$TAG" --repo "$GH_REPO" --draft=false --prerelease --latest=false
          gh release view "$TAG" --repo "$GH_REPO" --json url,isDraft,isPrerelease
