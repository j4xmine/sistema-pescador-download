name: Publish validated GuiaBridge 0.5.41
on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-guiabridge-0541.yml]
permissions:
  contents: write
concurrency:
  group: publish-guiabridge-0541
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TAG: guiabridge-v0.5.41
      INSTALLER: SistemaPescador-GuiaBridge-Atualizacao-0.5.41.exe
      INSTALLER_SHA256: acd0cfa28d2f01bfe401f8c843af70c36b9ba577a784a8a2c07539faf0a2a32b
      ARTIFACT_SHA256: 6dde7b79c0c90e823a9c56be63302c014e053699e263132352535c5ef02d0419
      SOURCE_URL: "https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-07c0-820e-b41f-991ab8bb3620/raw?se=2026-09-22T22%3A52%3A35Z&sp=r&sv=2026-02-06&sr=b&scid=01a0cb4b-8b76-7124-affd-59b30dff2ee9&skoid=db6dad9e-03ee-465b-aef6-ce0f63a161dc&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-22T20%3A21%3A01Z&ske=2026-09-23T20%3A21%3A01Z&sks=b&skv=2026-02-06&sig=vvHwsOcnZfVt/D4C/WgL9fw/0/2dEdWkaAygRknQ8dY%3D"
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify exact tested installer
        shell: bash
        run: |
          set -euo pipefail
          echo "::add-mask::$SOURCE_URL"
          curl --silent --show-error --fail --location --retry 2 "$SOURCE_URL" -o artifact.zip
          echo "$ARTIFACT_SHA256  artifact.zip" | sha256sum -c -
          mkdir dist
          unzip -q artifact.zip -d dist
          (cd dist && sha256sum -c SHA256SUMS.txt)
          echo "$INSTALLER_SHA256  dist/$INSTALLER" | sha256sum -c -
      - name: Record user validation
        shell: bash
        run: |
          cat > release-notes.md <<'EOF'
          **GuiaBridge 0.5.41 — validado no login real pelo usuário.**
          
          Corrige o timeout de 15 segundos ao enviar Enter no campo de senha do GOV.BR/eSocial. O envio do Enter e a espera pela autenticação são tratados separadamente. Em caso de envio incerto, o GuiaBridge acompanha a página e permite conclusão manual, sem repetir automaticamente a senha.
          
          ### Validação
          - Login real confirmado com sucesso pelo usuário após instalar este mesmo executável.
          - Sete testes de regressão de login aprovados: envio único, navegação lenta, 2FA, timeout real, navegador fechado, domínio inesperado e cancelamento.
          - Compilação Windows, 11 casos de isolamento de ambientes, atualização 0.5.40 → 0.5.41, reinstalação, backup e preservação de arquivos aprovados.
          - O segundo computador ainda será atualizado pelo usuário; esta publicação não declara teste realizado nele.
          
          ### Atualização no outro computador
          1. Feche o Sistema Pescador e as janelas de automação.
          2. Baixe e execute **SistemaPescador-GuiaBridge-Atualizacao-0.5.41.exe**.
          3. Aceite a elevação do Windows.
          4. Abra o sistema e clique em **Testar login**, na Central de GPS.
          
          Compatível com GuiaBridge 0.5.38, 0.5.39, 0.5.40 e reinstalação da 0.5.41.
          Atualiza somente `C:\Sistema Pescador\GuiaBridge`, com backup em `C:\Sistema Pescador\Backups\GuiaBridge-pre-0.5.41-<data>`.
          Preserva aplicativo, SQLite, documentos, ScannerBridge e perfis do navegador.
          O instalador não acessa o portal nem emite guias.
          
          Esta é uma atualização separada do GuiaBridge; execute o instalador disponibilizado nesta release.
          
          ### Rastreabilidade
          - Código e empacotamento: `9704a330229fda2f85ee2819e687b506e08b9eb9`.
          - [Validação no GitHub Actions](https://github.com/j4xmine/guia-bridge/actions/runs/35791245302).
          - SHA-256 do instalador: `acd0cfa28d2f01bfe401f8c843af70c36b9ba577a784a8a2c07539faf0a2a32b`.
          EOF
          cp release-notes.md dist/ATUALIZACAO-GUIABRIDGE.md
          (cd dist && sha256sum ATUALIZACAO-GUIABRIDGE.md guia-bridge-manifest.json "$INSTALLER" > SHA256SUMS.txt)
      - name: Publish validated component release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists; refusing to overwrite."
            exit 1
          fi
          gh release create "$TAG" \
            "dist/$INSTALLER" dist/SHA256SUMS.txt dist/guia-bridge-manifest.json dist/ATUALIZACAO-GUIABRIDGE.md \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft \
            --title "GuiaBridge 0.5.41 — validado" --notes-file release-notes.md
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease=false --latest=false
