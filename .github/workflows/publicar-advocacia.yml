name: Publicar Advocacia candidata verificada
on:
  push:
    branches: [release/advocacia-1.1.0-rc.1]
permissions:
  contents: write
concurrency:
  group: publicacao-advocacia-1.1.0-rc.1
  cancel-in-progress: false
jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: v1.1.0-rc.1
      BACK_BLOB: 93356926f6a45bd360b439cb35f1d41b94df2fb3
      FRONT_BLOB: 8a4e0e4d26eb673a44c10229f140698bc3ad33c8
      BACK_MANIFEST_SHA: e1cce24b87ddef7d792ec45b1e9b4756b38f6c6ecb627d091a2536ffe10646df
      FRONT_MANIFEST_SHA: 4ff020b86ed2a0a8aa6b62e11279df6865b6a57857a349a922ee41b41a311531
      BACK_COMMIT: ed7d5c533be8ed332fe4774304228bef43fc87a7
      FRONT_COMMIT: e600ff4f22dc0ada91bb1686c7a1f4aaaedc23a1
    steps:
      - name: Recuperar os mesmos arquivos validados
        run: |
          set -Eeuo pipefail
          gh api "repos/$GH_REPO/git/blobs/$BACK_BLOB" > back-transport.json
          gh api "repos/$GH_REPO/git/blobs/$FRONT_BLOB" > front-transport.json
          python3 - <<'PY'
          import base64,hashlib,json,os,shutil,urllib.request
          from pathlib import Path
          from urllib.parse import urlparse
          root=Path('dist');root.mkdir()
          def sha(p):return hashlib.sha256(p.read_bytes()).hexdigest()
          def recover(source,key,names,artifact,limit):
              envelope=json.loads(Path(source).read_text());assert envelope['encoding']=='base64'
              data=json.loads(base64.b64decode(envelope['content']))
              assert set(data['files'])==names
              for name in names:(root/name).write_bytes(base64.b64decode(data['files'][name],validate=True))
              url=data[key];p=urlparse(url)
              assert p.scheme=='https' and p.hostname=='release-assets.githubusercontent.com'
              print('::add-mask::'+url)
              with urllib.request.urlopen(url,timeout=90) as src,(root/artifact).open('wb') as dest:
                  while block:=src.read(1024*1024):
                      dest.write(block);assert dest.tell()<limit*1024*1024
          back={'cnpj-migracao.jar','instalar-advocacia.py','backend-manifest.json','ADVOCACIA-SERVIDOR.md','SHA256SUMS-backend.txt'}
          front={'unified-manifest.json','ADVOCACIA-INSTALACAO.md','SHA256SUMS.txt'}
          jar='sistema-pescador-backend-advocacia.jar'
          setup='SistemaPescador-Setup-1.1.0-rc.1.exe'
          alias='SistemaPescador-Atualizacao-1.1.0-rc.1.exe'
          recover('back-transport.json','jarUrl',back,jar,300)
          recover('front-transport.json','installerUrl',front,setup,250)
          shutil.copyfile(root/setup,root/alias)
          assert sha(root/'backend-manifest.json')==os.environ['BACK_MANIFEST_SHA']
          assert sha(root/'unified-manifest.json')==os.environ['FRONT_MANIFEST_SHA']
          b=json.loads((root/'backend-manifest.json').read_text())
          f=json.loads((root/'unified-manifest.json').read_text(encoding='utf-8-sig'))
          assert b['commit']==os.environ['BACK_COMMIT'] and b['version']=='1.1.0-rc.1-advocacia'
          assert b['oabEnabled'] is False and b['sha256']==sha(root/jar)
          assert f['frontendCommit']==os.environ['FRONT_COMMIT'] and f['version']=='1.1.0-rc.1'
          assert f['updateSequence']==6501 and f['backendUpdateRequired'] is True and f['requiredBackendVersion']==b['version']
          assert f['bridgeVersion']=='0.5.58' and f['scannerVersion']=='2.0.2' and f['databaseSchemaAfter']==12
          assert {a['name'] for a in f['artifacts']}=={setup,alias}
          for a in f['artifacts']:assert a['sha256']==sha(root/a['name'])
          for checksum,allowed in [('SHA256SUMS-backend.txt',back-{'SHA256SUMS-backend.txt'}|{jar}),('SHA256SUMS.txt',front-{'SHA256SUMS.txt'}|{setup,alias})]:
              seen=set()
              for line in (root/checksum).read_text(encoding='utf-8-sig').splitlines():
                  digest,name=line.split('  ',1)
                  assert name in allowed and name not in seen
                  assert sha(root/name)==digest;seen.add(name)
              assert seen==allowed
          notes='''# Advocacia 1.1.0-rc.1 — candidata
          
          Cadastro profissional de escritórios e autônomos, múltiplas inscrições OAB, equipe e painel jurídico. Mantém as funções da Barracuda. A consulta automática e a foto CNA continuam desativadas até a credencial oficial e homologação.
          
          ## 1. Atualizar o servidor
          
          Em horário de manutenção, concluir emissões/sincronizações e executar no terminal do EC2 usado nas atualizações anteriores. O script aceita somente a RC63.2, faz backup dos arquivos e da coleção entidades/índices e prepara CNPJ opcional sem alterar documentos. Falha de inicialização aciona tentativa de retorno. Consulte ADVOCACIA-SERVIDOR.md.
          
          ```bash
          bash <<'ADVOCACIA'
          set -euo pipefail
          pasta_advocacia=$(mktemp -d "$HOME/pescador-advocacia-XXXXXXXX")
          cd "$pasta_advocacia"
          base_advocacia="https://github.com/j4xmine/sistema-pescador-download/releases/download/v1.1.0-rc.1"
          for arquivo in SHA256SUMS-backend.txt ADVOCACIA-SERVIDOR.md backend-manifest.json instalar-advocacia.py cnpj-migracao.jar sistema-pescador-backend-advocacia.jar; do
            curl --fail --location --retry 3 "$base_advocacia/$arquivo" --output "$arquivo"
          done
          echo '__CHECKSUM__  SHA256SUMS-backend.txt' | sha256sum --check -
          sha256sum --check SHA256SUMS-backend.txt
          sudo python3 ./instalar-advocacia.py "$PWD/sistema-pescador-backend-advocacia.jar"
          ADVOCACIA
          ```
          
          Esperar ADVOCACIA_BACKEND_INSTALADO=True. Se houver erro, não instalar o novo aplicativo; preserve a saída final e o backup para revisão. Não compartilhar arquivos de configuração nem conteúdo dos cadastros.
          
          ## 2. Instalar em um computador
          
          Após confirmar o servidor, salvar o trabalho, fechar o programa e executar SistemaPescador-Setup-1.1.0-rc.1.exe sem desinstalar a Barracuda. O arquivo Atualizacao é idêntico. Aceita computador novo e atualização direta. Usa a API de produção: cadastros confirmados são reais. Conferir SHA256SUMS.txt e ADVOCACIA-INSTALACAO.md.
          
          ## Validação e limites
          
          Suíte do servidor e do aplicativo, migração com retorno em Mongo descartável e instalação/reparo/preservação de dados sintéticos no Windows. Mesmos binários validados, sem recompilação na publicação. O uso integrado no EC2 e no seu computador ainda será confirmado pelo operador.
          
          GuiaBridge 0.5.58, ScannerBridge 2.0.2 e esquema local 12. Clientes gerais, processos, procurações e honorários específicos não fazem parte desta etapa. Publicação candidata: o catálogo estável permanece na Barracuda.
          '''
          Path('NOTAS.md').write_text(notes.replace('__CHECKSUM__',sha(root/'SHA256SUMS-backend.txt')))
          print('BINARIOS_PUBLICADOS_IGUAIS_AOS_VALIDADOS=True')
          print('SHA256_LISTA_BACKEND='+sha(root/'SHA256SUMS-backend.txt'))
          print('SHA256_INSTALADOR='+sha(root/setup))
          PY
      - name: Publicar candidata sem alterar o catalogo estavel
        run: |
          set -Eeuo pipefail
          if gh release view "$TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            echo 'Versao ja existe; nenhuma substituicao automatica feita.'
            exit 1
          fi
          gh release create "$TAG" --repo "$GH_REPO" --target "$GITHUB_SHA" --draft --title 'Advocacia — 1.1.0-rc.1 (candidata)' --notes-file NOTAS.md dist/*
          gh release edit "$TAG" --repo "$GH_REPO" --draft=false --prerelease=true --latest=false
          gh release view "$TAG" --repo "$GH_REPO" --json url,isDraft,isPrerelease
