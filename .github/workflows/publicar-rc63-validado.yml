name: Publicar candidato RC63 validado
on:
  push:
    branches: [main]
    paths: [.github/workflows/publicar-rc63-validado.yml]
permissions:
  contents: write
concurrency:
  group: publicar-rc63-validado
  cancel-in-progress: false
jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Conferir hashes e publicar candidato sem alterar canal estavel
        shell: python
        run: |
          import base64, hashlib, json, os, pathlib, subprocess, urllib.request
          repo="j4xmine/sistema-pescador-download"
          tag="v1.0.0-rc.63-rede.1"
          release_id=407159362
          payload=json.loads("{\"installerUrl\":\"https://release-assets.githubusercontent.com/github-production-release-asset/1295982440/dbd85a7c-806f-4f00-8d36-b90da9be25ba?sp=r&sv=2018-11-09&sr=b&spr=https&se=2026-10-08T19%3A44%3A54Z&rscd=attachment%3B+filename%3DSistemaPescador-Setup-1.0.0-rc.63-rede.1.exe&rsct=application%2Foctet-stream&skoid=96c2d410-5711-43a1-aedd-ab1947aa7ab0&sktid=398a6654-997b-47e9-b12b-9515b896b4de&skt=2026-10-08T18%3A43%3A59Z&ske=2026-10-08T19%3A44%3A54Z&sks=b&skv=2018-11-09&sig=sxgODXLS75ksmtkump2rp878%2F1PkjUrUtme%2F2cVZoSs%3D&jwt=eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJpc3MiOiJnaXRodWIuY29tIiwiYXVkIjoicmVsZWFzZS1hc3NldHMuZ2l0aHVidXNlcmNvbnRlbnQuY29tIiwia2V5Ijoia2V5MSIsImV4cCI6MTc5MTQ5MDA2MCwibmJmIjoxNzkxNDg2NDYwLCJwYXRoIjoicmVsZWFzZWFzc2V0cHJvZHVjdGlvbi5ibG9iLmNvcmUud2luZG93cy5uZXQifQ.Zsf96mQQHoq5u0cJfWIfDVokUPcquMdlfSKAEhdxkyA&response-content-disposition=attachment%3B%20filename%3DSistemaPescador-Setup-1.0.0-rc.63-rede.1.exe&response-content-type=application%2Foctet-stream\",\"files\":{\"unified-manifest.json\":\"\",\"REDE-CORPORATIVA-RC63.md\":\"\",\"SHA256SUMS.txt\":\"\"}}")
          expected_backend=json.loads("{\"backend-manifest.json\":\"5e803d4658aacec1f04420948b2722c7096c48abc0360dd5200be91b5531943d\",\"instalar-rede-corporativa.sh\":\"82145d1ae20a6362fb0103dd235501b7dd07cbd7ac696b7bbab4c85e593eaf93\",\"REDE-CORPORATIVA-RC63.md\":\"6abaeaec9d2af41abaa487cadcae7251d575362eed20b2f9c743910f92897dc3\",\"SHA256SUMS-backend.txt\":\"4bd49e8533b1aad9c00cdeefbb46d8f804e262cffcf9551ba0c202ca9ad3ab1c\",\"sistema-pescador-backend-rede-corporativa.jar\":\"7d364f1331cc99374900766d1a7a8c8a19058d03bb6cc28e768a3e376e4aeb66\"}")
          def gh(*args):
              return subprocess.check_output(["gh",*args],text=True)
          def digest(p):
              return hashlib.sha256(p.read_bytes()).hexdigest()
          r=json.loads(gh("api",f"repos/{repo}/releases/{release_id}"))
          assert r["draft"] and r["tag_name"]==tag, "Release mudou; conferir antes de publicar"
          original_catalog=gh("api",f"repos/{repo}/contents/desktop-update.json")
          for p in ("desktop","backend","out"): pathlib.Path(p).mkdir()
          subprocess.run(["gh","release","download",tag,"--repo",repo,"--dir","backend"],check=True)
          for name,expected in expected_backend.items():
              assert digest(pathlib.Path("backend")/name)==expected, f"Hash backend divergente: {name}"
          for name,value in payload["files"].items():
              assert name in ("unified-manifest.json","REDE-CORPORATIVA-RC63.md","SHA256SUMS.txt")
              (pathlib.Path("desktop")/name).write_bytes(base64.b64decode(value))
          installer="SistemaPescador-Setup-1.0.0-rc.63-rede.1.exe"
          print("::add-mask::"+payload["installerUrl"],flush=True)
          with urllib.request.urlopen(payload["installerUrl"],timeout=120) as response:
              (pathlib.Path("desktop")/installer).write_bytes(response.read())
          for line in pathlib.Path("desktop/SHA256SUMS.txt").read_text(encoding="utf-8-sig").splitlines():
              expected,name=line.split(None,1)
              assert digest(pathlib.Path("desktop")/name.strip())==expected, f"Hash desktop divergente: {name}"
          m=json.loads(pathlib.Path("desktop/unified-manifest.json").read_text(encoding="utf-8-sig"))
          assert m["frontendCommit"]=="8970fe8523b3a8b4ff88ef9b5b860b8bbc565e71"
          assert m["version"]=="1.0.0-rc.63-rede.1"
          for p in pathlib.Path("backend").iterdir(): (pathlib.Path("out")/p.name).write_bytes(p.read_bytes())
          for name in (installer,"unified-manifest.json"):
              (pathlib.Path("out")/name).write_bytes((pathlib.Path("desktop")/name).read_bytes())
          pathlib.Path("out/REDE-CORPORATIVA-DESKTOP-RC63.md").write_bytes(pathlib.Path("desktop/REDE-CORPORATIVA-RC63.md").read_bytes())
          sums="".join(f"{digest(p)}  {p.name}\n" for p in sorted(pathlib.Path("out").iterdir()))
          pathlib.Path("out/SHA256SUMS.txt").write_text(sums)
          upload=[installer,"unified-manifest.json","REDE-CORPORATIVA-DESKTOP-RC63.md","SHA256SUMS.txt"]
          subprocess.run(["gh","release","upload",tag,"--repo",repo,*[str(pathlib.Path("out")/n) for n in upload]],check=True)
          fresh=json.loads(gh("api",f"repos/{repo}/releases/{release_id}"))
          for name in list(expected_backend)+upload:
              asset=next(a for a in fresh["assets"] if a["name"]==name)
              assert asset["digest"]=="sha256:"+digest(pathlib.Path("out")/name), f"Upload divergente: {name}"
          assert original_catalog==gh("api",f"repos/{repo}/contents/desktop-update.json"), "Catalogo estavel mudou"
          patch={"draft":False,"prerelease":True,"make_latest":"false","name":"RC63 — Rede corporativa candidata"}
          pathlib.Path("publish.json").write_text(json.dumps(patch))
          subprocess.run(["gh","api",f"repos/{repo}/releases/{release_id}","--method","PATCH","--input","publish.json"],check=True,stdout=subprocess.DEVNULL)
          done=json.loads(gh("api",f"repos/{repo}/releases/{release_id}"))
          assert not done["draft"] and done["prerelease"]
          assert original_catalog==gh("api",f"repos/{repo}/contents/desktop-update.json")
          print("RC63 publicada como candidata; canal estavel preservado.")
          print(done["html_url"])
          
