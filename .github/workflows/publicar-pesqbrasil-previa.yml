name: Publicar previa PesqBrasil validada
on:
  push:
    branches: [release/pesqbrasil-1.1.3-rc.6]
permissions:
  contents: write
jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Conferir hashes e publicar somente prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 publicar-pesqbrasil-previa.py
