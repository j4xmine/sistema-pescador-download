name: Publicar Marlin manutencao validada
on:
  push:
    branches: [release/manutencao-1.1.2-rc.3]
permissions:
  contents: write
jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Conferir e publicar os mesmos pacotes validados
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 publicar-manutencao.py
