name: Publicar RC57 validada
on:
  push:
    branches: [release/rc57-publicar]
    paths: [.github/workflows/publicar-rc57.yml]
permissions:
  contents: write
concurrency:
  group: publicar-rc57
  cancel-in-progress: false
jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TAG: v1.0.0-rc.57-cadastro-gps.2
      INSTALLER: SistemaPescador-Atualizacao-1.0.0-rc.57-cadastro-gps.2.exe
      INSTALLER_SHA256: ac79c05977205ea8b0b124dd2d9264a68186e600f842cd7bbb4c46abdd171065
    steps:
      - uses: actions/checkout@v4
      - name: Transferir e conferir pacote exato
        shell: bash
        env:
          SOURCE_URL: "https://release-assets.githubusercontent.com/github-production-release-asset/1295982440/1ad3c555-438d-4196-8c71-04963df4b78f?sp=r&sv=2018-11-09&sr=b&spr=https&se=2026-10-03T19%3A42%3A03Z&rscd=attachment%3B+filename%3DSistemaPescador-Atualizacao-1.0.0-rc.57-cadastro-gps.2.exe&rsct=application%2Foctet-stream&skoid=96c2d410-5711-43a1-aedd-ab1947aa7ab0&sktid=398a6654-997b-47e9-b12b-9515b896b4de&skt=2026-10-03T18%3A42%3A01Z&ske=2026-10-03T19%3A42%3A03Z&sks=b&skv=2018-11-09&sig=tNpq8PZmPIle0ZhO3glHX7dNgrZZHgCc7Bwt%2FONHhB4%3D&jwt=eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJpc3MiOiJnaXRodWIuY29tIiwiYXVkIjoicmVsZWFzZS1hc3NldHMuZ2l0aHVidXNlcmNvbnRlbnQuY29tIiwia2V5Ijoia2V5MSIsImV4cCI6MTc5MTA1NDcyMiwibmJmIjoxNzkxMDUyOTIyLCJwYXRoIjoicmVsZWFzZWFzc2V0cHJvZHVjdGlvbi5ibG9iLmNvcmUud2luZG93cy5uZXQifQ.aYfjcNQZx72KtonSLM-EK6MpkY1VigseUrDrwjo37D8&response-content-disposition=attachment%3B%20filename%3DSistemaPescador-Atualizacao-1.0.0-rc.57-cadastro-gps.2.exe&response-content-type=application%2Foctet-stream"
        run: |
          set -Eeuo pipefail
          echo "::add-mask::$SOURCE_URL"
          mkdir dist
          curl --silent --show-error --fail --location --retry 2 "$SOURCE_URL" -o "dist/$INSTALLER"
          echo "$INSTALLER_SHA256  dist/$INSTALLER" | sha256sum -c -
          cp release-rc57/unified-manifest.json release-rc57/guia-bridge-manifest.json release-rc57/RELEASE-RC57.md dist/
          printf '%s\n' 'ed3a28fea0b5d9334b65dfbf0c6d1ac657c5d99ad05ba3cc7122616a6cc3032c  dist/unified-manifest.json' 'ddcd67be36edd90ad1c32474e9a8e3561447464e15f10fe1e11df4863d5a15fa  dist/guia-bridge-manifest.json' | sha256sum -c -
          jq -e '.frontendCommit == "7989b8a2d2cc1e217225f60b4e9ccb0b4e7bc3fc" and .version == "1.0.0-rc.57-cadastro-gps.2" and .bridgeVersion == "0.5.53"' dist/unified-manifest.json >/dev/null
          (cd dist && sha256sum "$INSTALLER" unified-manifest.json guia-bridge-manifest.json RELEASE-RC57.md > SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)
      - name: Publicar versao validada
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Release existente; nao sera sobrescrita.'
            exit 1
          fi
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft --title 'Sistema Pescador RC57 — cadastro durante a emissão de GPS — validado' --notes-file dist/RELEASE-RC57.md
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease=false --latest=true
      - name: Conferir download publico sem autenticacao
        shell: bash
        run: |
          set -Eeuo pipefail
          curl --silent --show-error --fail --location --retry 3 --retry-all-errors "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$INSTALLER" -o publico.exe
          echo "$INSTALLER_SHA256  publico.exe" | sha256sum -c -
          echo PUBLIC_DOWNLOAD_VERIFIED=True
