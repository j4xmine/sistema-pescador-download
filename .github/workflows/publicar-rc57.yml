name: Publicar RC57 validada
on:
  push:
    branches: [release/rc57-3-publicar]
    paths: [.github/workflows/publicar-rc57.yml]
permissions:
  contents: write
concurrency:
  group: publicar-rc57
  cancel-in-progress: false
jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TAG: v1.0.0-rc.57-cadastro-gps.3
      INSTALLER: SistemaPescador-Atualizacao-1.0.0-rc.57-cadastro-gps.3.exe
      INSTALLER_SHA256: d97068f6867d535cedcc74b63c4cc8c6ec5e07a56e9206a463bff8b1fdaf118e
    steps:
      - uses: actions/checkout@v4
      - name: Transferir e conferir pacote exato
        shell: bash
        env:
          SOURCE_URL: "https://release-assets.githubusercontent.com/github-production-release-asset/1295982440/a04a7c46-2f81-46af-a93b-aeef9970c08d?sp=r&sv=2018-11-09&sr=b&spr=https&se=2026-10-05T07%3A11%3A49Z&rscd=attachment%3B+filename%3DSistemaPescador-Atualizacao-1.0.0-rc.57-cadastro-gps.3.exe&rsct=application%2Foctet-stream&skoid=96c2d410-5711-43a1-aedd-ab1947aa7ab0&sktid=398a6654-997b-47e9-b12b-9515b896b4de&skt=2026-10-05T06%3A11%3A36Z&ske=2026-10-05T07%3A11%3A49Z&sks=b&skv=2018-11-09&sig=aFHAbEAC6UXKI1yxncbykmU92wkT4oSGRnJ5HkYureA%3D&jwt=eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJpc3MiOiJnaXRodWIuY29tIiwiYXVkIjoicmVsZWFzZS1hc3NldHMuZ2l0aHVidXNlcmNvbnRlbnQuY29tIiwia2V5Ijoia2V5MSIsImV4cCI6MTc5MTE4MjY1MiwibmJmIjoxNzkxMTgwODUyLCJwYXRoIjoicmVsZWFzZWFzc2V0cHJvZHVjdGlvbi5ibG9iLmNvcmUud2luZG93cy5uZXQifQ.xrcSmXgtKZlFmu2MTMRLBalSo6fVqMQNtZNVFZN6Yt0&response-content-disposition=attachment%3B%20filename%3DSistemaPescador-Atualizacao-1.0.0-rc.57-cadastro-gps.3.exe&response-content-type=application%2Foctet-stream"
        run: |
          set -Eeuo pipefail
          echo "::add-mask::$SOURCE_URL"
          mkdir dist
          curl --silent --show-error --fail --location --retry 2 "$SOURCE_URL" -o "dist/$INSTALLER"
          echo "$INSTALLER_SHA256  dist/$INSTALLER" | sha256sum -c -
          cp release-rc57/unified-manifest.json release-rc57/guia-bridge-manifest.json release-rc57/RELEASE-RC57.md dist/
          printf '%s\n' 'f953e9fb050ca0da9a6e28cf197244d43f49580ca46d526c7e10c6be4352fbb6  dist/unified-manifest.json' '9b493fbfeddd7548c34554e34392cfef60ee800b8e1ee50472a3837cab8b3b91  dist/guia-bridge-manifest.json' | sha256sum -c -
          jq -e '.frontendCommit == "82b8587843a5b362bab7d821e0005b972754425c" and .version == "1.0.0-rc.57-cadastro-gps.3" and .bridgeVersion == "0.5.58"' dist/unified-manifest.json >/dev/null
          (cd dist && sha256sum "$INSTALLER" unified-manifest.json guia-bridge-manifest.json RELEASE-RC57.md > SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)
      - name: Publicar versao validada
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Release existente; nao sera sobrescrita.'
            exit 1
          fi
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft --title 'Sistema Pescador RC57.3 — GuiaBridge 0.5.58 validado' --notes-file dist/RELEASE-RC57.md
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease=false --latest=true
      - name: Conferir download publico sem autenticacao
        shell: bash
        run: |
          set -Eeuo pipefail
          curl --silent --show-error --fail --location --retry 3 --retry-all-errors "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$INSTALLER" -o publico.exe
          echo "$INSTALLER_SHA256  publico.exe" | sha256sum -c -
          echo PUBLIC_DOWNLOAD_VERIFIED=True
